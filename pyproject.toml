[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "connecto-core"
version = "1.0.0"
description = "Biophysical closed-loop simulation of the C. elegans connectome driving 3D hydrodynamics and on-chain telemetry."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
